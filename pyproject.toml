[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "node_modules", "extensions/*/web-ext-artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
