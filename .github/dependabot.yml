version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directories: ['/', '/frontend/web']
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      node-tooling:
        patterns: ['*']
