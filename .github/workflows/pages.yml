name: Portfolio Pages

# Publishing is an explicit action after reviewing the dedicated static showcase.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_PORTFOLIO_PAGES == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a dedicated static showcase
        run: |
          if [ ! -f portfolio/index.html ]; then
            echo 'Create and review portfolio/index.html before enabling Pages. Never publish the unfinished live frontend or the repository root.' >&2
            exit 1
          fi
          if find portfolio -type l | grep -q .; then
            echo 'Pages source must not contain symlinks.' >&2
            exit 1
          fi
          touch portfolio/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: portfolio
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed showcase
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
