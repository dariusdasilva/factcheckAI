  <head><title>Common cold: prevention and treatment</title></head>
  <body>
    <article>
      <h1>Common cold</h1>
      <p>
        There is no cure for the common cold. Treatment focuses on relieving
        symptoms such as congestion, sore throat and fever.
      </p>
      <p>
        Antibiotics are not effective against the viruses that cause colds and
        should not be used.
      </p>
    </article>
